name: Build BASS BEATS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      BASS_KEYSTORE_BASE64: ${{ secrets.BASS_KEYSTORE_BASE64 }}
      BASS_STORE_PASSWORD: ${{ secrets.BASS_STORE_PASSWORD }}
      BASS_KEY_ALIAS: ${{ secrets.BASS_KEY_ALIAS }}
      BASS_KEY_PASSWORD: ${{ secrets.BASS_KEY_PASSWORD }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check project files
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Prepare permanent signing key
        if: ${{ env.BASS_KEYSTORE_BASE64 != '' && env.BASS_STORE_PASSWORD != '' && env.BASS_KEY_ALIAS != '' && env.BASS_KEY_PASSWORD != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.BASS_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bass-beats-upload.jks"
          test -s "$RUNNER_TEMP/bass-beats-upload.jks"

      - name: Build signed Release APK
        if: ${{ env.BASS_KEYSTORE_BASE64 != '' && env.BASS_STORE_PASSWORD != '' && env.BASS_KEY_ALIAS != '' && env.BASS_KEY_PASSWORD != '' }}
        env:
          BASS_KEYSTORE_PATH: ${{ runner.temp }}/bass-beats-upload.jks
        run: gradle --no-daemon assembleRelease

      - name: Build temporary Debug APK (signing secrets not configured)
        if: ${{ env.BASS_KEYSTORE_BASE64 == '' || env.BASS_STORE_PASSWORD == '' || env.BASS_KEY_ALIAS == '' || env.BASS_KEY_PASSWORD == '' }}
        run: gradle --no-daemon assembleDebug

      - name: Verify Release APK
        if: ${{ env.BASS_KEYSTORE_BASE64 != '' && env.BASS_STORE_PASSWORD != '' && env.BASS_KEY_ALIAS != '' && env.BASS_KEY_PASSWORD != '' }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Verify Debug APK
        if: ${{ env.BASS_KEYSTORE_BASE64 == '' || env.BASS_STORE_PASSWORD == '' || env.BASS_KEY_ALIAS == '' || env.BASS_KEY_PASSWORD == '' }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload signed Release APK
        if: ${{ env.BASS_KEYSTORE_BASE64 != '' && env.BASS_STORE_PASSWORD != '' && env.BASS_KEY_ALIAS != '' && env.BASS_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: BASS-BEATS-2.1-SIGNED-RELEASE
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload temporary Debug APK
        if: ${{ env.BASS_KEYSTORE_BASE64 == '' || env.BASS_STORE_PASSWORD == '' || env.BASS_KEY_ALIAS == '' || env.BASS_KEY_PASSWORD == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: BASS-BEATS-DEBUG-TEMPORARY-DO-NOT-USE-FOR-UPDATES
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
